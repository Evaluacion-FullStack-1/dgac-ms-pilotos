server:
  port: ${PORT:8082} # Puerto local para pilotos

spring:
  application:
    name: dgac-ms-pilotos # ¡VITAL! Así es como el Gateway creará la ruta automática
    
  # Tu conexión a la base de datos Neon (asegúrate de usar los datos correctos para pilotos si es una BD distinta, o déjalo así si usan la misma)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-aged-cloud-aqdbd64c-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_t9MGlKdf0DTv}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    preferIpAddress: true
  client:
    # Apunta a la URL de tu Jefe mediante la variable de entorno
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8080/eureka/}